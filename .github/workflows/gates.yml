name: gates

# The hermetic subset: everything here runs on a bare runner with no C64 ROMs,
# no media, no assembler and no runtime daemon. That is the whole design — a
# gate that needs an asset the runner cannot have is a gate that goes red for
# the wrong reason, gets ignored, and takes the rest of CI with it. That is
# exactly what happened here before: four workflows referenced 36 scripts that
# Spec 806 deleted with the TypeScript emulator, the nightly went red every day
# from June, and by July nothing ran at all.
#
# What is NOT here, and stays a local gate: anything needing resources/roms,
# a KickAssembler/64tass binary, real disk images, or the TRX64 daemon —
# smoke:741, check:platform-kb, the graph e2e set (e2e:818-e2e:823), measure:*.
# e2e:830 is here and DOES use KickAssembler when it is present: it skips that
# one check loudly on a runner that has no jar, and still asserts the clamped
# byte output either way.
#
# Two gates are red on master as of 2026-09-06 and are therefore left out until
# they are fixed, rather than being added and muted:
#   test:lifecycle    D structural-enrichment: got "discovery" want "re"
#   test:mcp-workflow custom-GCR lenient decode

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install
        run: npm ci

      # Both halves: ESM server + CommonJS pipeline. A TypeScript error in
      # either is the most common breakage and the cheapest to catch.
      - name: Build
        run: npm run build

      - name: Build the workspace bundle
        run: npm run ui:build

      # Rule 9 — no document may describe a world that no longer exists.
      - name: Docs are current
        run: npm run check:docs-current

      # The generated tool surface must match the live one. This went stale on
      # master when Spec 833 D3 reworded disasm_prg's description: the check
      # lives inside check:mcp-product-surface, which is NOT in this workflow
      # (it needs assets a runner does not have), so CI stayed green over a
      # generated file describing the old state — rule 9, missed by a gate that
      # was never here. This one line is hermetic; the rest of that suite is not.
      - name: Generated tool surface is current
        run: npm run gen:tool-surface -- --check

      - name: Cartridge type ids agree with VICE
        run: npm run check:cart-type-ids

      - name: Project knowledge store
        run: npm run test:project-knowledge

      - name: Project steering (Spec 748)
        run: npm run e2e:748

      # The launchers are generated text for a machine this runner is not, so
      # the generator is what gets checked: quoting, CRLF, the PowerShell 5.1
      # traps. The pwsh half skips loudly when PowerShell is absent.
      - name: Workspace launchers
        run: npm run smoke:ui-launcher

      - name: Model router skills and agents
        run: npm run smoke:model-router

      # Spec 827 — pure path policy, so the platform it targets does not have to
      # be the platform it runs on.
      - name: Trace storage location (Spec 827)
        run: npm run e2e:827

      # Spec 828 — hermetic on purpose: the fix is that a lookup must not need
      # the network, so its gate must not either.
      - name: Reference coverage (Spec 828)
        run: npm run e2e:828

      # Spec 829 — hermetic: the token table is checked against the ROM's own
      # ordering, the DATA rule and the round trip against real bytes. No ROM
      # image, no network, no assembler.
      - name: BASIC V2 tooling (Spec 829)
        run: npm run e2e:829

      # Spec 830 — both hermetic: the renderer gate builds its own PRG and runs
      # the bundled analyzer on it (the byte-identical rebuild half skips loudly
      # when KickAssembler is absent, which on a bare runner it is), and the seed
      # gate makes a temp project with a mirror in it.
      - name: Entry point inside an operand (Spec 830)
        run: npm run e2e:830

      - name: Seed owner collision (Spec 830)
        run: npm run e2e:830-seed

      # Spec 831 — hermetic: a temp project, the path library, the route and the
      # two call sites read as source. The point of the spec is that the path is
      # decided on this side, so it can be checked without a daemon.
      - name: Dump location and receipt (Spec 831)
        run: npm run e2e:831

      # Spec 832 — the Ultima VI reports. All five hermetic: synthetic PRGs,
      # a synthesised GCR track built from this repo's own encoder, and temp
      # projects. No ROMs, no real media, no daemon. (e2e:832-annotations uses
      # KickAssembler for the byte-identity half and skips that check loudly
      # without a jar, the same way e2e:830 does.)
      - name: Annotation labels (Spec 832 D1)
        run: npm run e2e:832-annotations

      - name: Disk load address and manifest readers (Spec 832 D2/D3)
        run: npm run e2e:832-disk

      - name: GCR extraction fidelity (Spec 832 D4)
        run: npm run e2e:832-gcr

      - name: Audit policy and ids (Spec 832 D5/D6)
        run: npm run e2e:832-ids

      - name: LUT refusal names its class limit (Spec 832 §8)
        run: npm run e2e:832-lut

      # Spec 833 — all three hermetic: synthetic PRGs, a GCR track from this
      # repo's own encoder, and a temp project with C64RE_PROJECT_DIR removed
      # from the child environment so the fallback cannot rescue the resolver.
      - name: Render truth (Spec 833 D1/D2/D3)
        run: npm run e2e:833-render

      - name: Sector filenames (Spec 833 D4)
        run: npm run e2e:833-sectors

      - name: Sandbox project hint (Spec 833 D5)
        run: npm run e2e:833-sandbox

      # Spec 834 — all three hermetic: a temp project, C64RE_PROJECT_DIR
      # deleted from the child and the cwd moved outside any project, so no
      # fallback can rescue the resolver. The daemon is stubbed; they assert
      # RESOLUTION, never a run, which is why an absent runtime cannot decide
      # the verdict.
      - name: Headless project hints (Spec 834 §2)
        run: npm run e2e:834-headless

      - name: Trace-store resolution (Spec 834 §3)
        run: npm run e2e:834-trace-store

      - name: Scene reel project hint (Spec 834 §4)
        run: npm run e2e:834-scene-reel

      # Spec 835 — hermetic: it reads the generated tool surface and the
      # source, no daemon and no network.
      - name: The session tool says what it accepts (Spec 835)
        run: npm run e2e:835

      # Spec 836 — hermetic on purpose: the defect is a WRITE to a machine
      # somebody else is using, so the gate must not need that machine to exist.
      - name: An attach never swaps the shared medium (Spec 836)
        run: npm run e2e:836-attach

      # Spec 836 D3 — the live half needs the runtime binary and skips loudly
      # without it; everything else is source and surface.
      - name: A machine of your own (Spec 836 D3)
        run: npm run e2e:836-sandbox

      # Spec 838 — three field reports, three gates, all hermetic. The paths
      # gate runs its Windows assertions on every platform on purpose: the
      # platform it targets is not the platform it runs on.
      - name: An id is not a path (Spec 838 D1)
        run: npm run e2e:838-paths

      - name: A harvest may not invent bytes (Spec 838 D2)
        run: npm run e2e:838-harvest

      - name: Code entered from another overlay (Spec 838 D3)
        run: npm run e2e:838-islands

      # Spec 839 — what the human can do, the LLM can do. The media gate is
      # hermetic (source + generated surface). The delta report needs the TRX64
      # checkout to know what a daemon verb IS, and says so and passes when it is
      # absent rather than guessing — guessing the verb list from string shapes is
      # exactly how the first measurement of this delta went wrong.
      - name: A cartridge comes out, and a tool says what it does (Spec 839)
        run: npm run e2e:839-media

      - name: UI reaches nothing the LLM cannot (Spec 839)
        run: npm run check:ui-mcp-delta

      # Spec 825 — both halves are hermetic: the route gate analyses a 64-byte
      # synthetic PRG with the bundled pipeline and seeds a temp project, and
      # the explorer gate reads the built bundle plus the two pure lib files.
      # No ROMs, no media, no assembler, no runtime daemon. (`measure:825` is
      # NOT here: it needs a real project and it measures, it does not gate.)
      - name: Graph subgraph route (Spec 825 D1)
        run: npm run smoke:825-routes

      - name: Graph explorer (Spec 825)
        run: npm run smoke:825
